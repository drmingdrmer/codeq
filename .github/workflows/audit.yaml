name: audit

# Advisories appear without code changes, so this runs on pushes to main and
# on a daily schedule, but not on every PR.
on:
  push:
    branches: [main]
  schedule: [cron: "40 1 * * *"]

jobs:

  audit:
    name: audit
    runs-on: ubuntu-latest

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v2


      - name: Setup | Toolchain
        uses: actions-rs/toolchain@v1.0.6


      - shell: bash
        run: cargo install cargo-audit --locked


      - name: Audit dependencies
        shell: bash
        # if: "!contains(github.event.head_commit.message, 'skip audit')"
        run: cargo audit --db ./target/advisory-db
